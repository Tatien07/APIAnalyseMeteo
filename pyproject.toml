[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "energy-weather-monitor"
version = "0.9.0"
description = "API d'agrégation de données météorologiques et énergétiques"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]
dashboard = [
  "pandas>=2.2,<3",
  "plotly>=6,<7",
  "streamlit>=1.44,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/energy_weather"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
  "integration: tests nécessitant une vraie base PostgreSQL",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
