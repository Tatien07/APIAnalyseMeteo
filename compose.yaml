services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: energy_weather
      POSTGRES_USER: energy_weather
      POSTGRES_PASSWORD: energy_weather
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energy_weather -d energy_weather"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build: .
    command: alembic upgrade head
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./alembic.ini:/app/alembic.ini:ro
      - ./migrations:/app/migrations:ro

  api:
    build: .
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8001:8000"

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    env_file: .env
    depends_on:
      - api
    ports:
      - "8502:8501"

  weather-collector:
    build: .
    command: python -m energy_weather.collectors.weather
    env_file: .env
    profiles: ["jobs"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  energy-collector:
    build: .
    command: python -m energy_weather.collectors.energy
    env_file: .env
    profiles: ["jobs"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  freshness-check:
    build: .
    command: python -m energy_weather.monitoring
    env_file: .env
    profiles: ["jobs"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  test:
    build:
      context: .
      target: test
    volumes:
      - .:/app
    command:
      - sh
      - -c
      - >-
        ruff check src tests migrations dashboard &&
        ruff format --check src tests migrations dashboard &&
        pytest -m "not integration" --cov=energy_weather --cov-report=term-missing
    profiles: ["ci"]

  integration-db:
    image: postgres:17-alpine
    profiles: ["integration"]
    environment:
      POSTGRES_DB: energy_weather_test
      POSTGRES_USER: energy_weather_test
      POSTGRES_PASSWORD: integration-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energy_weather_test -d energy_weather_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  integration-test:
    build:
      context: .
      target: test
    profiles: ["integration"]
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://energy_weather_test:integration-only@integration-db:5432/energy_weather_test
    depends_on:
      integration-db:
        condition: service_healthy
    command:
      - sh
      - -c
      - alembic upgrade head && pytest -m integration

  jenkins:
    build:
      context: .
      dockerfile: jenkins/Dockerfile
    user: root
    profiles: ["jenkins"]
    ports:
      - "8081:8080"
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/application_default_credentials.json
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ${APPDATA}/gcloud:/gcloud:ro

  terraform:
    image: hashicorp/terraform:1.12.2
    profiles: ["infra"]
    working_dir: /workspace/infrastructure/bootstrap
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/application_default_credentials.json
    volumes:
      - .:/workspace
      - ${APPDATA}/gcloud:/gcloud:ro

  terraform-state:
    image: hashicorp/terraform:1.12.2
    profiles: ["infra"]
    working_dir: /workspace/infrastructure/state-bootstrap
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/application_default_credentials.json
    volumes:
      - .:/workspace
      - ${APPDATA}/gcloud:/gcloud:ro

  terraform-platform:
    image: hashicorp/terraform:1.12.2
    profiles: ["infra"]
    working_dir: /workspace/infrastructure/platform
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/application_default_credentials.json
    volumes:
      - .:/workspace
      - ${APPDATA}/gcloud:/gcloud:ro

volumes:
  postgres_data:
  jenkins_data:
